name: MIERU AICHI navigation final audit (read-only)
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public site URL
        required: true
        default: https://code4aichi.org/atlas/
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check genuine pointer navigation
        id: audit
        continue-on-error: true
        env:
          MIERU_URL: ${{ inputs.site_url }}
        run: python tests/atlas_navigation_final_audit.py
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mieru-navigation-final-results
          path: atlas-navigation-final-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve result status
        if: always()
        env:
          RESULT: ${{ steps.audit.outcome }}
        run: test "$RESULT" = "success"
