name: MIERU AICHI four pending audits (read-only)
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Deployed atlas URL'
        required: true
        type: string
        default: 'https://code4aichi.org/atlas/'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MIERU_URL: ${{ inputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright>=1.52,<2'
          python -m playwright install --with-deps chromium
      - name: Audit outstanding checks
        id: audit
        continue-on-error: true
        run: python tests/atlas_four_pending_audit.py
      - name: Upload results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mieru-four-pending-results
          path: four-pending-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Fail workflow on confirmed FAIL
        if: always()
        env:
          RESULT: ${{ steps.audit.outcome }}
        run: test "$RESULT" = success
