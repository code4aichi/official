name: MIERU AICHI external domains research (staging only)

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Employment, migration or both (not published)'
        type: choice
        options:
          - migration
          - employment
          - all
        default: migration
      start_year:
        description: 'Minimum survey year (not publication year)'
        type: number
        default: 2020
      limit:
        description: 'Results per keyword/page (1-100)'
        type: number
        default: 50
      max_pages:
        description: 'Maximum pages per keyword (1-5)'
        type: number
        default: 2
      inspect_metadata:
        description: 'Inspect municipality codes in first N candidate tables (0-15)'
        type: number
        default: 5

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E_STAT_APP_ID: ${{ secrets.E_STAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check API app ID exists
        run: test -n "$E_STAT_APP_ID" || (echo 'Missing E_STAT_APP_ID secret' && exit 1)
      - name: Research recent statistics and municipality metadata
        env:
          THEME: ${{ inputs.theme }}
          START_YEAR: ${{ inputs.start_year }}
          LIMIT: ${{ inputs.limit }}
          MAX_PAGES: ${{ inputs.max_pages }}
          INSPECT_METADATA: ${{ inputs.inspect_metadata }}
        run: |
          python tools/external_domain_discovery.py \
            --theme "$THEME" --start-year "$START_YEAR" \
            --limit "$LIMIT" --max-pages "$MAX_PAGES" \
            --inspect-metadata "$INSPECT_METADATA"
      - name: Upload review candidates (never published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mieru-external-domain-candidates
          path: staging/external_domain_candidates.json
          if-no-files-found: warn
          retention-days: 14
