name: MIERU AICHI v2.9.19 polish acceptance
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public site URL
        type: string
        required: true
        default: https://code4aichi.org/atlas/
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Test desktop and mobile
        env:
          MIERU_URL: ${{ inputs.site_url }}
        run: python tests/atlas_v2919_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mieru-v2919-polish-results
          path: v2919-results/
