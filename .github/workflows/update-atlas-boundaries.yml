name: MIERU AICHI e-Stat staging (no publishing)
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Search e-Stat statistics table by Japanese keyword'
        required: true
        default: '経済センサス'
      stats_id:
        description: 'Optional e-Stat statsDataId to fetch raw data and metadata'
        required: false
        default: ''
      aichi_only:
        description: 'Filter stats table to the 54 Aichi municipalities (recommended for large tables)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E_STAT_APP_ID: ${{ secrets.E_STAT_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate secret
        run: test -n "$E_STAT_APP_ID" || (echo 'Configure E_STAT_APP_ID secret' && exit 1)
      - name: Search statistics catalog (only when no stats_id)
        if: ${{ inputs.stats_id == '' }}
        run: python tools/estat_pipeline.py search --keyword "${{ inputs.keyword }}"
      - name: Fetch optional table snapshot
        if: ${{ inputs.stats_id != '' }}
        env:
          STATS_ID: ${{ inputs.stats_id }}
          AICHI_ONLY: ${{ inputs.aichi_only }}
        run: |
          if [ "$AICHI_ONLY" = "true" ]; then
            python tools/estat_pipeline.py fetch --stats-id "$STATS_ID" --aichi-only
          else
            python tools/estat_pipeline.py fetch --stats-id "$STATS_ID"
          fi
      - name: Upload staging files (not public site)
        uses: actions/upload-artifact@v4
        with:
          name: e-stat-staging
          path: staging/*.json
          retention-days: 7
